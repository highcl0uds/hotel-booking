spring:
  datasource:
    # своя база на каждый Spring-контекст, чтобы закешированные контексты не делили таблицы
    url: jdbc:h2:mem:hotel-test-${random.uuid};DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000

eureka:
  client:
    enabled: false

app:
  security:
    jwt:
      secret: test-only-jwt-secret-0123456789-0123456789-abcdef

logging:
  file:
    # без файлов логов в тестах
    name: ""
